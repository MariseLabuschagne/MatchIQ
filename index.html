
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>MatchIQ</title>

    <meta
        name="theme-color"
        content="#020617">

    <meta
        name="description"
        content="Capture. Analyse. Improve.">

    <!-- PWA -->

    <meta
        name="mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

    <meta
        name="apple-mobile-web-app-title"
        content="MatchIQ">

    <link
        rel="manifest"
        href="manifest.json">

    <!-- Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com">

    <!-- Styles -->

    <link
        rel="stylesheet"
        href="css/styles.css">
        

</head>

<body>

    <div id="app">

        <!-- =====================================================
             HEADER
        ====================================================== -->

            <header
                id="appHeader"
                class="app-header"
            >
          
            <div class="logo-area">

                

            </div>


        </header>

        <!-- =====================================================
             CONTENT
        ====================================================== -->

        <main id="main-content">

            <!-- =================================================
                 HOME SCREEN
            ================================================== -->

            
            <div id="homeScreen">

                <div class="home-container">

                    <img
                        src="assets/logo/matchiq-logo.jpeg"
                        alt="MatchIQ Logo"
                        class="home-logo"
                    />

                    <div class="sport-selection">

                        <button
                            class="sport-button hockey"
                            onclick="showHockeyMenu()"
                        >
                            🏑 Field Hockey
                        </button>
                       
                        <button
                            class="sport-button softball"
                            onclick="showSoftballMenu()"
                        >

                            🥎 Softball

                        </button>

                        <button
                            class="sport-button disabled"
                            disabled
                        >
                            🎾 Tennis
                            <br>
                            <span class="coming-soon">
                                Coming Soon
                            </span>

                        </button>

                    </div>

                    <div class="home-version">

                        Version 2.0.9

                    </div>

                </div>
            </div>


            <!-- =================================================
                 MATCH SETUP
            ================================================== -->

            <section
                id="setupScreen"
                class="card hidden">

                <h2
                    style="
                        margin-bottom:24px;
                    ">
                    New Match
                </h2>

                <!-- Competition -->

                <div class="form-group">

                    <label for="competition">
                        Competition
                    </label>

                    <input
                        id="competition"
                        type="text"
                        placeholder="Tournament / League">

                </div>

                <!-- Our Team -->

                <div class="form-group">

                    <label for="ourTeam">
                        Our Team
                    </label>

                    <input
                        id="ourTeam"
                        type="text"
                        placeholder="e.g. Hennopspark U12A">

                </div>

                <!-- Opponent -->

                <div class="form-group">

                    <label for="opponent">
                        Opponent
                    </label>

                    <input
                        id="opponent"
                        type="text"
                        placeholder="Opponent">

                </div>

                <!-- Venue -->

                <div class="form-group">

                    <label>
                        Venue
                    </label>

                    <div class="radio-group">

                        <label>
                            <input
                                type="radio"
                                name="venue"
                                value="Home"
                                checked>
                            Home
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="venue"
                                value="Away">
                            Away
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="venue"
                                value="Neutral">
                            Neutral
                        </label>

                    </div>

                </div>

               <div
                    class="form-group"
                    id="battingTeamGroup"
                    style="display:none;"
                >
                    <label>
                        Team Batting First
                    </label>

                    <div class="radio-group">

                        <label>
                            <input
                                type="radio"
                                name="batFirst"
                                value="ourBatting"
                                checked
                            >
                            Our Team
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="batFirst"
                                value="opponentBatting"
                            >
                            Opposition
                        </label>

                    </div>

                </div>

                <!-- Our Team Roster -->

                <div class="form-group" id="rosterGroup" style="display:none;">

                    <label>Our Team Roster (optional)</label>

                    <div class="roster-grid">
                        <div>
                            <input id="roster1" type="text" placeholder="Player #1">
                            <label><input type="radio" name="pitcher1" value="1"> P1</label>
                            <label><input type="radio" name="pitcher2" value="1"> P2</label>
                        </div>
                        <div>
                            <input id="roster2" type="text" placeholder="Player #2">
                            <label><input type="radio" name="pitcher1" value="2"> P1</label>
                            <label><input type="radio" name="pitcher2" value="2"> P2</label>
                        </div>
                        <div>
                            <input id="roster3" type="text" placeholder="Player #3">
                            <label><input type="radio" name="pitcher1" value="3"> P1</label>
                            <label><input type="radio" name="pitcher2" value="3"> P2</label>
                        </div>
                        <div>
                            <input id="roster4" type="text" placeholder="Player #4">
                            <label><input type="radio" name="pitcher1" value="4"> P1</label>
                            <label><input type="radio" name="pitcher2" value="4"> P2</label>
                        </div>
                        <div>
                            <input id="roster5" type="text" placeholder="Player #5">
                            <label><input type="radio" name="pitcher1" value="5"> P1</label>
                            <label><input type="radio" name="pitcher2" value="5"> P2</label>
                        </div>
                        <div>
                            <input id="roster6" type="text" placeholder="Player #6">
                            <label><input type="radio" name="pitcher1" value="6"> P1</label>
                            <label><input type="radio" name="pitcher2" value="6"> P2</label>
                        </div>
                        <div>
                            <input id="roster7" type="text" placeholder="Player #7">
                            <label><input type="radio" name="pitcher1" value="7"> P1</label>
                            <label><input type="radio" name="pitcher2" value="7"> P2</label>
                        </div>
                        <div>
                            <input id="roster8" type="text" placeholder="Player #8">
                            <label><input type="radio" name="pitcher1" value="8"> P1</label>
                            <label><input type="radio" name="pitcher2" value="8"> P2</label>
                        </div>
                        <div>
                            <input id="roster9" type="text" placeholder="Player #9">
                            <label><input type="radio" name="pitcher1" value="9"> P1</label>
                            <label><input type="radio" name="pitcher2" value="9"> P2</label>
                        </div>
                    </div>

                </div>

                <div
                    class="form-group"
                    id="pitcherGroup"
                    style="display:none;"
                >

                    <label>
                        Our Team Pitchers
                    </label>

                    <input
                        id="ourPitcher1"
                        type="text"
                        placeholder="Pitcher 1"
                    >

                    <input
                        id="ourPitcher2"
                        type="text"
                        placeholder="Pitcher 2"
                        style="margin-top:8px;"
                    >

                    <label
                        style="margin-top:12px;display:block;"
                    >
                        Opposition Pitchers
                    </label>

                    <input
                        id="oppPitcher1"
                        type="text"
                        placeholder="Pitcher 1"
                    >

                    <input
                        id="oppPitcher2"
                        type="text"
                        placeholder="Pitcher 2"
                        style="margin-top:8px;"
                    >

                </div>

                <!-- Format -->

                <div
                    class="form-group"
                    id="matchFormatGroup">
                    <label>
                        Match Format
                    </label>

                    <div class="radio-group">

                        <label>
                            <input
                                type="radio"
                                name="format"
                                value="2"
                                checked>
                            2 Halves
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="format"
                                value="4">
                            4 Quarters
                        </label>

                    </div>

                </div>

                <!-- Period Length -->

                <div
                    class="form-group"
                    id="periodLengthGroup">
                    <label for="periodLength">
                        Period Length (Minutes)
                    </label>

                    <select id="periodLength">

                        <option>10</option>
                        <option>12</option>
                        <option>15</option>
                        <option selected>16</option>
                        <option>20</option>
                        <option>25</option>
                        <option>30</option>

                    </select>

                </div>

                <!-- Start Match -->

                <button
                    id="startMatchButton"
                    class="primary-button">

                    🏑 START MATCH

                </button>

            </section>

             <!-- =================================================
                 HOCKEY SCREEN
            ================================================== -->
            
            <section
                id="hockeyMenuScreen"
                class="hidden"
            >
            </section>

            <!-- =================================================
                 SOFTBALL SCREEN
            ================================================== -->

            <section
                id="softballMenuScreen"
                class="hidden">
            </section>
            

            <!-- =================================================
                 LIVE MATCH SCREEN
            ================================================== -->

            <section
                id="liveMatchScreen"
                class="hidden">

            </section>

            <!-- =================================================
                HISTORY SCREEN
            ================================================== -->
            
            <section
                id="historyScreen"
                class="hidden"
            >
            </section>
    

        </main>

    </div>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/events.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
